<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starwatch</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F2F7F7; --ink:#0F172A; --ink2:#475569; --ink3:#5B6A7E;
  --teal:#0E6E6B; --rule:rgba(22,37,36,.16); --rule-soft:rgba(22,37,36,.10);
  --font:'Schibsted Grotesk',system-ui,sans-serif;
  --display:'Bricolage Grotesque','Schibsted Grotesk',system-ui,sans-serif;
  --expo:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
body.idle{cursor:none}

/* fixed 1920x1080 stage, letterboxed onto the same canvas colour */
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--canvas)}

/* lockup */
.brand{position:absolute;left:96px;top:64px;display:flex;align-items:center;gap:14px}
.brand svg{width:42px;height:42px;overflow:visible}
.brand img{height:27px}

/* one line, set large */
h1{position:absolute;left:92px;top:300px;width:800px;font-family:var(--display);font-optical-sizing:auto;font-weight:720;font-size:126px;line-height:.95;letter-spacing:-.03em}
h1 .ln{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
h1 .ln>span{display:block}
h1 .quiet{color:var(--ink3);font-weight:600}

/* the product, bleeding off the right edge */
.shot{position:absolute;margin:0}
.hero{left:930px;top:120px;width:1100px}
.hero .frame{height:836px;border-radius:12px 0 0 12px;overflow:hidden;box-shadow:0 1px 2px rgb(15 23 42/.06),0 20px 52px -18px rgb(15 23 42/.24);outline:1px solid var(--rule-soft)}
.hero .frame img{display:block;width:1600px;max-width:none;height:auto;margin-left:-400px}

/* credit */
.foot{position:absolute;left:96px;right:96px;bottom:44px;display:flex;align-items:baseline;justify-content:space-between;gap:40px}
.credit{font-size:17px;color:var(--ink2);letter-spacing:-.005em}
.credit b{color:var(--ink);font-weight:600}
.cta{font-size:18px;font-weight:650;color:var(--teal);text-decoration:none;white-space:nowrap;letter-spacing:-.01em}
.cta kbd{font-family:inherit;font-size:14px;font-weight:600;color:var(--ink3);border:1px solid var(--rule);border-radius:5px;padding:2px 7px;margin-left:10px}
.cta .arr{display:inline-block;transition:transform .3s var(--expo)}
.cta:hover .arr,.cta:focus-visible .arr{transform:translateX(4px)}
.cta:focus-visible{outline:2px solid var(--teal);outline-offset:6px;border-radius:4px}

/* one orchestrated reveal */
.r-up{transform:translateY(105%)}
.r-fade{opacity:0;transform:translateY(14px)}
.hero .frame{opacity:0;transform:scale(1.03);transform-origin:20% 40%}
.blade{opacity:0;transform:var(--t)}
.go .r-up{transform:none;transition:transform 1.1s var(--expo) var(--d,0s)}
.go .r-fade{opacity:1;transform:none;transition:opacity .9s var(--expo) var(--d,0s),transform .9s var(--expo) var(--d,0s)}
.go .hero .frame{opacity:1;transform:none;transition:opacity 1.1s var(--expo) .4s,transform 1.8s var(--expo) .4s}
.go .blade{opacity:1;transform:none;transition:opacity .6s var(--expo) var(--d),transform 1s var(--expo) var(--d)}
@media (prefers-reduced-motion:reduce){
  .r-up,.r-fade,.hero .frame,.blade{opacity:1!important;transform:none!important;transition:none!important}
}
body{cursor:pointer}
</style>
</head>
<body>
<main class="stage" id="stage">
  <header class="brand" aria-label="Starwatch">
    <svg viewBox="-32 -32 64 64" aria-hidden="true">
      <path class="blade" style="--d:.05s;--t:translateX(-12px)" fill="#0E6E6B" d="M-30,0L-10.06,8.55L-6.77,-1.31L-5.21,-0.79L-0.91,-5.09L-10.59,-8.32Z"/>
      <path class="blade" style="--d:.13s;--t:translateY(12px)" fill="#0E6E6B" d="M0,30L8.55,10.06L-1.31,6.77L-0.79,5.21L-5.09,0.91L-8.32,10.59Z"/>
      <path class="blade" style="--d:.21s;--t:translateX(12px)" fill="#0E6E6B" d="M30,0L10.06,-8.55L6.77,1.31L5.21,0.79L0.91,5.09L10.59,8.32Z"/>
      <path class="blade" style="--d:.29s;--t:translateY(-12px)" fill="#0E6E6B" d="M0,-30L-8.55,-10.06L1.31,-6.77L0.79,-5.21L5.09,-0.91L8.32,-10.59Z"/>
    </svg>
    <img class="r-fade" style="--d:.35s" src="brand/wordmark.svg" alt="Starwatch">
  </header>

  <h1 aria-label="Who's being heard. Not just who's talking.">
    <span class="ln"><span class="r-up" style="--d:.15s">Who's being</span></span>
    <span class="ln"><span class="r-up" style="--d:.24s">heard.</span></span>
    <span class="ln quiet"><span class="r-up" style="--d:.33s">Not just who's</span></span>
    <span class="ln quiet"><span class="r-up" style="--d:.42s">talking.</span></span>
  </h1>

  <figure class="shot hero">
    <div class="frame"><img src="media/welcome/a-atlas-city.png" alt="Star Atlas, Praha: party islands of real public posts sized by reach"></div>
  </figure>

  <footer class="foot r-fade" style="--d:1.1s">
    <p class="credit"><b>Daniel Večeřa</b> · DANDAPANDA · Agents 0.0.7, Prague</p>
    <a class="cta" href="atlas.html" id="cta">Open Starwatch <span class="arr">→</span><kbd>Enter</kbd></a>
  </footer>
</main>
<script>
(() => {
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${s}) translate(-50%,-50%)`;
  };
  fit(); addEventListener('resize', fit);

  const start = () => requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('go')));
  (document.fonts ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 900))]) : Promise.resolve()).then(start);

  const go = () => swGo();
  addEventListener('click', e => { e.preventDefault(); go(); });  /* a click anywhere opens the map */
  addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); go(); }
    else if (e.key === 'f' || e.key === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.().catch(() => {});
    }
  });

  let t;
  const wake = () => { document.body.classList.remove('idle'); clearTimeout(t); t = setTimeout(() => document.body.classList.add('idle'), 2000); };
  addEventListener('mousemove', wake); wake();
})();
</script>
<script src="fx/welcome-go.js"></script>
</body>
</html>
