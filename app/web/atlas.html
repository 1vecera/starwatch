<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starwatch Atlas</title>
<link rel="stylesheet" href="ds.css">
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<link rel="stylesheet" href="brand/chrome.css">
<link rel="stylesheet" href="vendor/maplibre-gl-4.7.1.css">
<script src="nav.js"></script>
<style>
:root{--dock:0px;--pane:rgba(255,255,255,.80);--pane-line:rgba(15,23,42,.10);--isle:rgba(255,255,255,.74);--top:calc(var(--chrome-top,0px) + var(--chrome-h,60px) + 12px);--ease:cubic-bezier(.16,1,.3,1)}
body{overflow:hidden;background:var(--space)}
[hidden]{display:none!important}
/* full-bleed map: MapLibre over OpenFreeMap, local SVG underneath as the offline fallback */
#mapwrap{position:fixed;inset:0;z-index:0;background:var(--space);touch-action:none}
#svgmap{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;transition:opacity .6s}
#svgmap path{pointer-events:none}
#svgmap .kraj{fill:#E8ECF1;stroke:#FFFFFF;stroke-width:1}
#svgmap .cz{fill:none;stroke:#94A3B8;stroke-width:1.2}
#svgmap .czm{fill:#EEF1F5;fill-opacity:.74;fill-rule:evenodd;stroke:none}
#svgmap .czh{fill:none;stroke:#FFFFFF;stroke-width:6;stroke-opacity:.9;stroke-linejoin:round}
#svgmap .czb{fill:none;stroke:#3F5368;stroke-width:1.7;stroke-linejoin:round}
#svgmap .muni{fill:color-mix(in srgb,var(--brand) 6%,transparent);stroke:var(--brand);stroke-width:1;opacity:.45;transition:opacity .4s}
#svgmap .muni.on{opacity:1;stroke-width:2;fill:color-mix(in srgb,var(--brand) 9%,transparent)}
#map{position:absolute;inset:0;opacity:0;transition:opacity .7s}
#map.ready{opacity:1}
.maplibregl-ctrl-attrib{font-size:12px;background:rgba(255,255,255,.7)!important}
/* overlays */
#marks,#isles{position:fixed;inset:0;pointer-events:none;z-index:2}
#isles{z-index:3;will-change:transform}
.cm{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:7px;padding:0;background:none;border:0;cursor:pointer;transform:translate(var(--x),var(--y));transition:opacity .35s}
.cm i{display:block;width:calc(var(--r)*2);height:calc(var(--r)*2);margin-left:calc(var(--r)*-1);border-radius:50%;background:color-mix(in srgb,var(--brand) 22%,transparent);border:1.5px solid var(--brand);transition:transform .2s var(--ease),background .2s;flex:none}
.cm span{display:flex;flex-direction:column;line-height:1.2;padding:3px 8px;border-radius:7px;background:#FFFFFF;border:1px solid var(--pane-line);box-shadow:0 4px 12px -6px rgba(15,23,42,.25);transform:translateY(-50%);margin-top:calc(var(--r)*1)}
.cm{margin-top:calc(var(--r)*-1)}
.cm b{font-size:12.5px;font-weight:650;color:var(--label);white-space:nowrap}
.cm em{font-style:normal;font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.cm:hover i,.cm.hl i,.cm:focus-visible i{transform:scale(1.12);background:color-mix(in srgb,var(--brand) 38%,transparent)}
.cm:hover b,.cm.hl b{color:var(--brand)}
.cm:focus{outline:none}
#marks.off .cm{opacity:0;pointer-events:none}
.core{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;transition:opacity .4s}
.core i{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px rgba(255,255,255,.9)}
.core b{font-size:13px;font-weight:700;color:var(--label);padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.85)}
/* party islands: logo + name, then a reach-sized mosaic, biggest first */
.isl{position:absolute;pointer-events:auto;background:var(--isle);backdrop-filter:blur(10px) saturate(1.05);-webkit-backdrop-filter:blur(10px) saturate(1.05);border:1px solid var(--pane-line);border-radius:12px;padding:0 8px 8px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 12px 28px -16px rgba(15,23,42,.30);
  transition:opacity .35s,transform .45s var(--ease)}
.isl.on.grow{animation:grow .5s var(--ease) both}
@keyframes grow{from{opacity:.4;transform:scale(.94)}to{opacity:1;transform:none}}
.isl.rise{animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.isl.dim{opacity:.32;transform:scale(.97)}.isl.dim:hover{opacity:.7}
.isl.on{z-index:5;background:rgba(255,255,255,.90);box-shadow:0 1px 2px rgba(15,23,42,.08),0 22px 48px -18px rgba(15,23,42,.38)}
.isl.gone{opacity:0;transform:scale(.96);pointer-events:none}
.ih{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:8px 2px 7px;text-align:left;background:none;border:0;cursor:pointer}
.ih .lg{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:#fff;border:1px solid var(--hairline);overflow:hidden;flex:none}
.ih .lg img{width:18px;height:18px;object-fit:contain}
.ih .lg i{width:10px;height:10px;border-radius:50%;background:var(--gc)}
.ih .nm{min-width:0}
.ih .nm b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;font-size:13px;font-weight:650;line-height:1.25;color:color-mix(in srgb,var(--gc) 55%,#0F172A);overflow:hidden;overflow-wrap:anywhere}
.isl.on .ih .lg{width:40px;height:40px;border-radius:9px}.isl.on .ih .lg img{width:34px;height:34px}.isl.on .ih .nm b{font-size:15px}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:4px;margin-top:8px}
.pk{font-size:12px;font-weight:600;color:var(--label2);margin:10px 2px 0;display:flex;justify-content:space-between;gap:8px}.pk span{font-weight:500;color:var(--label2)}
.pp{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;background:none;border:0;font-size:12px;line-height:1.25;text-align:center;cursor:pointer;color:var(--label);min-width:0}
.pp:hover{background:rgba(241,244,248,.9)}.pp:hover b{color:var(--brand)}
.pp .av{width:44px;height:44px;font-size:14px}.pp.el .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gc)}
.pp b{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pp small{color:var(--label2);font-variant-numeric:tabular-nums}
.cm.nl span{visibility:hidden}.cm.nl:hover span,.cm.nl:focus-visible span{visibility:visible;z-index:2}
.r22{font-size:13px;color:var(--label2);margin-top:6px;font-variant-numeric:tabular-nums}.r22 b{color:var(--label);font-weight:650}
.insp h2 img.plogo{height:40px;max-width:56px;object-fit:contain}
.ih .nm small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12px;line-height:1.3;color:var(--label2);font-variant-numeric:tabular-nums;overflow:hidden}
.ih .nm small em{font-style:normal;color:var(--label);font-weight:650}
.ih .rkn{font-size:12px;font-weight:700;color:var(--label3);font-variant-numeric:tabular-nums}
.ih:hover .nm b{color:var(--brand)}
.iact{display:flex;gap:6px;align-items:center;margin:0 0 8px}
.iact .pill{height:28px;font-size:12.5px;padding:0 10px}
.iact .x{margin-left:auto;color:var(--label2)}
.mos{position:relative}
.th{position:absolute;border-radius:5px;overflow:hidden;background:var(--sunken);border:0;padding:0;cursor:pointer;transition:transform .14s,box-shadow .14s}
.th.sk{background:linear-gradient(100deg,var(--sunken) 30%,#F7F9FB 50%,var(--sunken) 70%) 0 0/300% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:-50% 0}}
.th:hover,.th:focus-visible{transform:scale(1.06);z-index:3;box-shadow:0 8px 20px rgba(15,23,42,.22)}
.th.on{outline:2px solid var(--brand);outline-offset:1px;z-index:2}
.th img,.th>svg{width:100%;height:100%;object-fit:cover;display:block}
.th img.ld{opacity:0}.th img{transition:opacity .35s}
.th video.hp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .pv{position:absolute;right:4px;bottom:4px;width:15px;height:15px;border-radius:50%;background:rgba(15,23,42,.66);display:grid;place-items:center}
.th .pv svg{width:7px;height:7px}
.th .bd{position:absolute;left:5px;bottom:5px;padding:1px 5px;border-radius:4px;background:rgba(15,23,42,.72);color:#fff;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
.th.more{display:grid;place-items:center;font-size:12px;color:var(--label2);font-weight:650;background:rgba(255,255,255,.7);border:1px solid var(--hairline);font-variant-numeric:tabular-nums}
.th.more:hover{color:var(--brand)}
.isl.on .th{animation:tin .45s var(--ease) both}
@keyframes tin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
/* floating panels */
.pane{position:fixed;top:var(--top);max-height:calc(100vh - var(--top) - 16px - var(--dock));z-index:10;background:var(--pane);backdrop-filter:blur(14px) saturate(1.05);-webkit-backdrop-filter:blur(14px) saturate(1.05);border:1px solid var(--pane-line);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 18px 40px -20px rgba(15,23,42,.30);display:flex;flex-direction:column;min-height:0;transition:transform .45s var(--ease),opacity .3s}
#side{left:16px;width:304px}
#insp{right:16px;width:384px}
#side.shut{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
#insp.shut{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
.ph{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 14px;border-bottom:1px solid var(--hairline)}
.ph .crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px;color:var(--label3)}
.crumbs button{font-size:13px;color:var(--label2);padding:3px 5px;border-radius:5px;background:none;border:0;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs button:hover{background:var(--glass-hi);color:var(--label)}
.crumbs button.cur{color:var(--label);font-weight:650}
.hide{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--label2);flex:none;background:none;border:0}
.hide:hover{background:var(--glass-hi);color:var(--label)}
.hide svg{width:14px;height:14px}
.pb{overflow:auto;flex:1;min-height:0;padding:0 14px 14px}
.pb section{padding:12px 0 10px;border-bottom:1px solid var(--hairline)}
.pb section:last-child{border-bottom:0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.sh .u{font-size:12px;color:var(--label3)}
.seg{flex-wrap:wrap}
#fRank,#fWin{display:flex;flex-wrap:nowrap;width:100%}#fRank button,#fWin button{flex:auto;height:26px;padding:0 6px;font-size:12px;white-space:nowrap}
.rnote{font-size:12px;color:var(--label3);margin-top:6px;line-height:1.4}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.pchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:13px;font-size:12px;font-weight:550;border:1px solid var(--hairline-strong);background:var(--surface);color:var(--label)}
.pchip em{font-style:normal;color:var(--label3);font-weight:500;font-variant-numeric:tabular-nums}
.pchip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.pchip svg,svg.pg{width:12px;height:12px;flex:none}
#fBare{height:26px;padding:0 9px;border-radius:13px;font-size:12px;color:var(--label2);border:1px dashed var(--hairline-strong);background:none}
#fBare.on{border-style:solid;border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.topics{display:flex;flex-wrap:wrap;gap:5px}
.tchip{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 9px;border-radius:13px;font-size:12px;font-weight:550;background:var(--surface);border:1px solid var(--hairline-strong);color:var(--label)}
.tchip em{font-style:normal;color:var(--label3);font-weight:500;font-variant-numeric:tabular-nums}
.tchip.on{background:var(--brand);border-color:var(--brand);color:#fff}.tchip.on em{color:rgba(255,255,255,.85)}
.tchip.iss{border-style:dashed}
.crow{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;padding:7px 6px;text-align:left;font-size:13.5px;align-items:center;border-radius:7px;background:none;border:0}
.crow b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow span{text-align:right;font-variant-numeric:tabular-nums;color:var(--label2);font-size:12.5px;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.crow span i{display:block;height:3px;border-radius:2px;background:var(--brand);opacity:.55}
.crow:hover,.crow.hl{background:rgba(241,244,248,.9)}.crow:hover b,.crow.hl b{color:var(--brand)}
#picker.gone{display:none}
#pFind{width:100%;justify-content:flex-start}#pFind span{flex:1;text-align:left}
.pon{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 8px 8px 10px;border-radius:10px;background:var(--brand-soft)}
.pon .t{flex:1;min-width:0;font-size:12.5px;color:var(--label2);line-height:1.35}.pon .t b{display:block;font-size:13.5px;color:var(--label);font-weight:650}
.pon button.x{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--label2);flex:none}.pon button.x:hover{background:rgba(15,23,42,.07);color:var(--label)}
.bigc{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px 6px 4px;border-radius:9px;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);font-size:12.5px;color:var(--label2);text-align:left;margin-bottom:6px}
.bigc b{color:var(--label);font-weight:650}.bigc:hover b{color:var(--brand)}
.rk{display:grid;grid-template-columns:16px 28px 1fr auto;gap:8px;align-items:center;width:100%;padding:5px 6px;border-radius:7px;text-align:left;font-size:13px;background:none;border:0}
.rk:hover,.rk.on{background:rgba(241,244,248,.9)}.rk.on .nm b{color:var(--brand)}
.rk>i{font-style:normal;color:var(--label3);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:color-mix(in srgb,var(--gc) 70%,#0F172A);background:color-mix(in srgb,var(--gc) 16%,var(--surface));overflow:hidden;border:1.5px solid color-mix(in srgb,var(--gc) 55%,transparent);flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.rk .nm{min-width:0}.rk .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .nm small{display:block;font-size:12px;color:var(--label3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--label2);font-size:12.5px;white-space:nowrap}
.lrow{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;padding:6px;border-radius:7px;text-align:left;font-size:13px;background:none;border:0}
.lrow:hover,.lrow.on{background:rgba(241,244,248,.9)}.lrow.on .nm{font-weight:650}
.lrow .lg{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:#fff;border:1px solid var(--hairline);overflow:hidden}
.lrow .lg img{width:18px;height:18px;object-fit:contain}.lrow .lg i{width:9px;height:9px;border-radius:50%;background:var(--gc)}
.lrow .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .bar0{display:block;height:2px;border-radius:1px;margin-top:3px;background:var(--gc);opacity:.6}
.cr2{display:grid;grid-template-columns:24px 1fr auto;gap:7px;align-items:center;width:100%;padding:4px 6px 4px 20px;font-size:12.5px;text-align:left;border-radius:7px;color:var(--label2);background:none;border:0}
.cr2 .av{width:24px;height:24px;font-size:12px}
.cr2:hover{background:rgba(241,244,248,.9);color:var(--label)}.cr2.on{color:var(--brand);font-weight:600}
.cr2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr2 small{color:var(--label3);font-size:12px}
.meth{font-size:12px;color:var(--label3);line-height:1.45;padding-top:10px}
.reopen{position:fixed;top:var(--top);z-index:9;display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:17px;background:var(--pane);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--pane-line);box-shadow:0 8px 22px -12px rgba(15,23,42,.35);font-size:13px;font-weight:600;color:var(--label);transition:opacity .3s,transform .3s var(--ease)}
.reopen svg{width:14px;height:14px}
#sideOpen{left:16px}#inspOpen{right:16px}
.reopen[hidden]{display:flex!important;opacity:0;pointer-events:none;transform:scale(.9)}
#zback{position:fixed;z-index:9;top:var(--top);left:50%;transform:translateX(-50%);height:34px;border-radius:17px;background:var(--pane);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--pane-line);box-shadow:0 8px 22px -12px rgba(15,23,42,.35);font-weight:600}
/* inspector */
.insp{padding:4px 16px 22px}
.insp h2{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.25;margin-top:4px;display:flex;align-items:center;gap:10px}
.insp .k{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--label3);margin:18px 0 6px;display:flex;justify-content:space-between;gap:8px}
.insp .k .x{text-transform:none;letter-spacing:0;font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;font-size:13px;margin-top:12px;border-top:1px solid var(--hairline)}
.k+.kv{margin-top:0}
.kv span{color:var(--label2);padding:7px 0;border-bottom:1px solid var(--hairline);white-space:nowrap}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;padding:7px 0 7px 16px;border-bottom:1px solid var(--hairline);min-width:0;overflow-wrap:anywhere}
.kv b a{color:var(--brand);text-decoration:none;font-weight:550}.kv b a:hover{text-decoration:underline}
.kv b small{display:block;font-weight:400;color:var(--label3);font-size:12px}
.hero{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:12.5px;color:var(--label2);align-items:baseline}
.hero b{font-size:17px;font-weight:700;color:var(--label);font-variant-numeric:tabular-nums;margin-right:4px}
.media{margin-top:10px;border-radius:10px;overflow:hidden;background:#0F172A}
.media video,.media img{display:block;width:100%;max-height:420px;object-fit:contain;background:#0F172A}
.media .un{padding:10px 12px;background:var(--sunken);font-size:12.5px;color:var(--label2);display:flex;justify-content:space-between;gap:8px;align-items:center}
.cap{font-size:14px;line-height:1.5;margin-top:12px;color:var(--label);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ahead .t-cap{display:flex;align-items:center;gap:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.acts a{text-decoration:none}
.clm{margin:6px 0;padding:7px 10px;background:var(--sunken);border-radius:6px;font-size:13px;line-height:1.4}
.note{font-size:12px;color:var(--label3);margin-top:8px;line-height:1.45}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.agrid .th{position:relative;aspect-ratio:1}
.agrid .th:first-child{grid-column:span 2;grid-row:span 2}
.plist{border-top:1px solid var(--hairline)}
.plist button{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;padding:6px 0;font-size:13px;border-bottom:1px solid var(--hairline);text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.plist button:hover b{color:var(--brand)}
.plist b{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist b small{color:var(--label3);font-weight:400;font-size:12px}
.plist span{color:var(--label2);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.lnk{font:inherit;font-weight:600;color:var(--label);padding:0;text-align:right;background:none;border:0}.lnk:hover{color:var(--brand);text-decoration:underline}
.tip{position:fixed;z-index:80;max-width:280px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.16);padding:9px 10px;font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .1s}

<script>
"use strict";
const {cities,lists,cands,assets,PLAT,TOP,fmt,fmtN,dstr,ago,css}=SW;
const REAL=SW.source.kind==='real';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=L=>css(L.col);
const ini=n=>n.split(/\s+/).map(s=>s[0]).join('').slice(0,2).toUpperCase();
const cf=v=>v>=1e6?(v/1e6).toFixed(v>=1e7?0:1).replace(/\.0$/,'')+'M':v>=1e4?Math.round(v/1e3)+'K':v>=1e3?(v/1e3).toFixed(1).replace(/\.0$/,'')+'K':String(Math.round(v));
const COV=SW.platformCoverage||PLAT.map(p=>({platform:p.k,name:p.n,verified_accounts:0,verified_assets:assets.filter(a=>PLAT[a.plat].k===p.k).length,playable_videos:0}));

const S={city:-1,list:-1,cand:-1,asset:-1,rank:RANKS[q.get('rank')]?q.get('rank'):'reach',win:999,plats:new Set(),topic:-1,bare:!REAL,party:null,pset:null};

/* ---------- metric and filters ---------- */

const hasMedia=a=>!!(a.img||a.vsrc);

const visible=a=>base(a)&&(S.bare||hasMedia(a));
const listAssets=L=>{const ids=[...L.assets];L.cands.forEach(k=>ids.push(...cands[k].assets));return ids.filter(i=>visible(assets[i]))};

const cityVal=c=>sum(c.assets.filter(i=>visible(assets[i])));
const byT=(a,b)=>tval(assets[b])-tval(assets[a])||eng(assets[b])-eng(assets[a]);
const mv=v=>S.rank==='posts'?fmtN(v):cf(v);
function cityCands(c){return c.cands.map(k=>cands[k]).map(C=>({C,v:cval(C),n:cvis(C).length})).filter(x=>x.n>0).sort((a,b)=>b.v-a.v||b.n-a.n)}
const logoSrc=L=>L.logos&&L.logos[0]&&L.logos[0].path?L.logos[0].path:null;
const lmark=L=>`<span class="lg" style="--gc:${col(L)}">${logoSrc(L)?`<img src="${esc(logoSrc(L))}" alt="" loading="lazy">`:'<i></i>'}</span>`;
const avatar=(C,gc)=>`<span class="av" aria-hidden="true" style="--gc:${gc}">${C.photo?`<img src="${esc(C.photo)}" alt="" loading="lazy">`:ini(C.name)}</span>`;
const pct=v=>(+v).toLocaleString('en-GB',{maximumFractionDigits:1})+' %';
const r22=L=>L.result2022&&L.result2022.pct!=null?L.result2022:null;
const r22line=L=>{const r=r22(L);return r?`2022 · <b>${pct(r.pct)}</b>${r.votes!=null?` · ${fmtN(r.votes)} votes`:''}${r.seats!=null?` · ${fmtN(r.seats)} seat${r.seats===1?'':'s'}`:''}`:''};
const pv=C=>C.pref2022&&C.pref2022.votes!=null?C.pref2022.votes:-1;
function listPeople(L){return (L.cands||[]).map(k=>cands[k]).filter(Boolean).map(C=>({C,v:cval(C),n:cvis(C).length})).sort((a,b)=>b.v-a.v||pv(b.C)-pv(a.C)||a.C.k-b.C.k)}
const lname=L=>L.name.length>48&&L.short?L.short:L.name;
function pplHtml(L,max){const pp=listPeople(L);const sh=pp.slice(0,max);
  return `<div class="pk">People on the list<span>${fmtN(L.size||pp.length)} registered · by ${esc(U().long)}, then 2022 votes</span></div><div class="ppl">${sh.map(({C,v})=>{const p=C.pref2022;return `<button class="pp ${p&&p.elected?'el':''}" data-k="${C.i}" style="--gc:${col(L)}" title="#${C.k} ${esc(C.name)}${v>0?' · '+fmtN(v)+' '+esc(U().unit):''}${p&&p.votes!=null?' · 2022: '+fmtN(p.votes)+' preference votes'+(p.elected?', elected':''):''}">${avatar(C,col(L))}<b>${esc(C.name)}</b><small>${v>0?mv(v):p&&p.votes!=null?fmtN(p.votes)+' pref.':'#'+C.k}${p&&p.elected?' · elected':''}</small></button>`}).join('')}</div>`}

function glyph(i){const k=PLAT[i].k;const P={instagram:'<rect x="1.5" y="1.5" width="9" height="9" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="6" cy="6" r="2.1" fill="none" stroke="currentColor" stroke-width="1.3"/>',facebook:'<path d="M7 11V6.6h1.6l.3-1.8H7V3.7c0-.5.2-.9.9-.9H9V1.2C8.7 1.1 8.1 1 7.5 1 6.1 1 5.2 1.9 5.2 3.4v1.4H3.6v1.8h1.6V11z" fill="currentColor"/>',tiktok:'<path d="M7.8 1h1.6c.1 1.2.9 2.1 2 2.2v1.6c-.8 0-1.4-.2-2-.6v3.5A3 3 0 1 1 6.6 4.9v1.7a1.4 1.4 0 1 0 1.2 1.3z" fill="currentColor"/>',youtube:'<rect x="1" y="2.5" width="10" height="7" rx="2" fill="currentColor"/><path d="M5 4.5v3l2.6-1.5z" fill="#fff"/>',x:'<path d="M1.5 1.5h2.6L10.5 10.5H7.9zM10.2 1.5 1.8 10.5" stroke="currentColor" stroke-width="1.2" fill="none"/>'};return `<svg class="pg" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">${P[k]||''}</svg>`}

/* ---------- geography: lon/lat for cities and boundaries ---------- */
const G0=window.SW_GEO||{kraje:[],cities:{}};
const bboxLL=rings=>{let a=1e9,b=-1e9,c=1e9,d=-1e9;rings.forEach(r=>r.forEach(([x,y])=>{a=Math.min(a,x);b=Math.max(b,x);c=Math.min(c,y);d=Math.max(d,y)}));return [[a,c],[b,d]]};
const COSL=Math.cos(49.8*Math.PI/180);
cities.forEach(c=>{const sh=G0.cities[c.name];if(sh){c.bb=bboxLL(sh);c.ll=[(c.bb[0][0]+c.bb[1][0])/2,(c.bb[0][1]+c.bb[1][1])/2]}else{c.ll=[c.x/(COSL*(SW.K||100))+15.5,c.y/(SW.K||100)+49.8];c.bb=[[c.ll[0]-.08,c.ll[1]-.05],[c.ll[0]+.08,c.ll[1]+.05]]}});
const ringA=r=>{let a=0;for(let i=0,j=r.length-1;i<r.length;j=i++)a+=(r[j][0]-r[i][0])*(r[j][1]+r[i][1]);return a/2};// >0 = counter-clockwise (lon/lat)
const BR=(window.SW_BORDER&&SW_BORDER.geometry?(SW_BORDER.geometry.type==='Polygon'?SW_BORDER.geometry.coordinates:SW_BORDER.geometry.coordinates.flat()):[]).filter(r=>r.length>8&&Math.abs(ringA(r))>1e-4);
const CZB=G0.kraje.length?bboxLL(G0.kraje.flatMap(k=>k.rings)):[[12.09,48.55],[18.86,51.06]];

/* ---------- camera: MapLibre when tiles load, local SVG otherwise ---------- */
const CAM={mode:'svg',k:1,tx:0,ty:0,anim:0,moveFns:[],target:null};
const PX=(lon,lat)=>[lon*COSL*100,-lat*100];
function svgBuild(){const P=r=>r.map(([lo,la],i)=>{const [x,y]=PX(lo,la);return (i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)}).join('')+'Z';
  let s=G0.kraje.map(k=>`<path class="kraj" vector-effect="non-scaling-stroke" d="${k.rings.map(P).join('')}"/>`).join('');
  if(BR.length){const [a,b]=[PX(-20,30),PX(50,70)];s+=`<path class="czm" d="M${a[0]} ${a[1]}H${b[0]}V${b[1]}H${a[0]}Z${BR.map(P).join('')}"/><path class="czh" vector-effect="non-scaling-stroke" d="${BR.map(P).join('')}"/><path class="czb" vector-effect="non-scaling-stroke" d="${BR.map(P).join('')}"/>`}
  else s+=`<path class="cz" vector-effect="non-scaling-stroke" d="${G0.kraje.flatMap(k=>k.rings).map(P).join('')}"/>`;
  s+=Object.entries(G0.cities).map(([n,rs])=>`<path class="muni" data-n="${esc(n)}" vector-effect="non-scaling-stroke" d="${rs.map(P).join('')}"/>`).join('');
  $('#svgcam').innerHTML=s}
function svgApply(){$('#svgcam').setAttribute('transform',`translate(${CAM.tx},${CAM.ty}) scale(${CAM.k})`);CAM.moveFns.forEach(f=>f())}
function svgFitT(b,p){const [x0,y1]=PX(b[0][0],b[0][1]),[x1,y0]=PX(b[1][0],b[1][1]);const aw=Math.max(40,innerWidth-p.left-p.right),ah=Math.max(40,innerHeight-p.top-p.bottom);
  const k=Math.min(aw/(x1-x0),ah/(y1-y0));return {k,tx:p.left+aw/2-(x0+x1)/2*k,ty:p.top+ah/2-(y0+y1)/2*k}}
function project(ll){if(CAM.mode==='maplibre'){const p=map.project(ll);return [p.x,p.y]}const [x,y]=PX(ll[0],ll[1]);return [x*CAM.k+CAM.tx,y*CAM.k+CAM.ty]}
function pad(extra){const sd=$('#side'),ip=$('#insp'),e=extra||0,n=narrow();
  return {left:(!n&&!sd.classList.contains('shut')?sd.getBoundingClientRect().right:0)+24+e,right:(!n&&!ip.classList.contains('shut')?innerWidth-ip.getBoundingClientRect().left:0)+24+e,
    top:$('#side').getBoundingClientRect().top+(n?40:8)+e,bottom:(n?(!ip.classList.contains('shut')?innerHeight*.52+84:84+44):0)+24+e}}
function camGo(b,dur){CAM.target=b;const p=pad(b===CZB?0:40);dur=reduce?0:dur;
  return new Promise(res=>{let done=false;const fin=()=>{if(done)return;done=true;res()};
    if(CAM.mode==='maplibre'){map.once('moveend',fin);map.fitBounds(b,{padding:p,duration:dur,essential:true,maxZoom:13.2,curve:1.3});setTimeout(fin,dur+500);return}
    const T=svgFitT(b,p),F={k:CAM.k,tx:CAM.tx,ty:CAM.ty};cancelAnimationFrame(CAM.anim);
    if(!dur||!F.k){Object.assign(CAM,T);svgApply();return fin()}
    const sx=p.left+(innerWidth-p.left-p.right)/2,sy=p.top+(innerHeight-p.top-p.bottom)/2;
    const w0=[(sx-F.tx)/F.k,(sy-F.ty)/F.k],w1=[(sx-T.tx)/T.k,(sy-T.ty)/T.k],t0=performance.now();
    const step=now=>{const t=Math.min(1,(now-t0)/dur),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
      const k=Math.exp(Math.log(F.k)+(Math.log(T.k)-Math.log(F.k))*e);const wx=w0[0]+(w1[0]-w0[0])*e,wy=w0[1]+(w1[1]-w0[1])*e;
      CAM.k=k;CAM.tx=sx-wx*k;CAM.ty=sy-wy*k;svgApply();if(t<1)CAM.anim=requestAnimationFrame(step);else fin()};
    CAM.anim=requestAnimationFrame(step)})}
// drag and wheel for the SVG fallback
(()=>{const el=$('#svgmap');let st=null;
  el.addEventListener('pointerdown',e=>{if(CAM.mode!=='svg')return;st={x:e.clientX,y:e.clientY,tx:CAM.tx,ty:CAM.ty};el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(!st)return;CAM.tx=st.tx+e.clientX-st.x;CAM.ty=st.ty+e.clientY-st.y;svgApply()});
  el.addEventListener('pointerup',()=>st=null);el.addEventListener('pointercancel',()=>st=null);
  el.addEventListener('wheel',e=>{if(CAM.mode!=='svg')return;e.preventDefault();const f=Math.exp(-e.deltaY*.0018),k=Math.max(5,Math.min(4e4,CAM.k*f));CAM.tx=e.clientX-(e.clientX-CAM.tx)*k/CAM.k;CAM.ty=e.clientY-(e.clientY-CAM.ty)*k/CAM.k;CAM.k=k;svgApply()},{passive:false})})();
let map=null;
function quiet(st){const set=(id,k,v)=>{const l=st.layers.find(x=>x.id===id);if(l){l.paint=l.paint||{};l.paint[k]=v}};
  set('background','background-color','#F1F3F6');set('water','fill-color','#D3DCE5');set('waterway','line-color','#C9D4DE');set('park','fill-color','#E4EAE6');set('landcover_wood','fill-color','#E1E7E3');
  set('building','fill-color','#E6E9ED');set('landuse_residential','fill-color','#EBEDF0');
  st.layers.forEach(l=>{if(l.type==='symbol'&&l.paint&&l.paint['text-color']){l.paint['text-color']=/label_(city|town|country|state)/.test(l.id)?'#334155':'#64748B';l.paint['text-halo-color']='rgba(243,245,248,.92)';l.paint['text-halo-width']=1.4;l.paint['text-halo-blur']=.4}
    if(/^boundary/.test(l.id)&&l.paint)l.paint['line-color']='#94A3B8';
    if(/^label_(city|city_capital|town)$/.test(l.id))l.minzoom=Math.max(l.minzoom||0,8)});
  return st}
function startMap(){
  if(!window.maplibregl)return;
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),5000);
  fetch('https://tiles.openfreemap.org/styles/positron',{signal:ctl.signal}).then(r=>{if(!r.ok)throw new Error('style '+r.status);return r.json()}).then(st=>{clearTimeout(to);
    try{map=new maplibregl.Map({container:'map',style:quiet(st),bounds:CAM.target||CZB,fitBoundsOptions:{padding:pad(CAM.target===CZB?0:40)},attributionControl:false,dragRotate:false,pitchWithRotate:false,touchPitch:false,fadeDuration:200,maxZoom:16})}catch(e){map=null;return}
    map.touchZoomRotate.disableRotation();
    map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'Boundaries: ČÚZK via siwekm/czech-geojson'}),'bottom-right');
    const fail=setTimeout(()=>{if(CAM.mode!=='maplibre'){try{map.remove()}catch(e){}map=null}},9000);
    map.on('load',()=>{clearTimeout(fail);
      const fc={type:'FeatureCollection',features:Object.entries(G0.cities).map(([n,rs])=>({type:'Feature',properties:{name:n},geometry:{type:'Polygon',coordinates:rs.map(r=>r[0][0]===r[r.length-1][0]&&r[0][1]===r[r.length-1][1]?r:[...r,r[0]])}}))};
      const kr={type:'FeatureCollection',features:G0.kraje.map(k=>({type:'Feature',properties:{name:k.name},geometry:{type:'MultiLineString',coordinates:k.rings}}))};
      const firstSym=(map.getStyle().layers.find(l=>l.type==='symbol')||{}).id;
      map.addSource('kraje',{type:'geojson',data:kr});
      map.addLayer({id:'kraje-line',type:'line',source:'kraje',paint:{'line-color':'#FFFFFF','line-width':['interpolate',['linear'],['zoom'],5,.9,10,2],'line-opacity':.9}},firstSym);
      if(BR.length){const hole=BR.map(r=>ringA(r)>0?[...r].reverse():r),world=[[-60,10],[80,10],[80,80],[-60,80],[-60,10]];
