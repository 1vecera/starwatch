<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starwatch</title>
<link rel="icon" href="brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..600&family=Bricolage+Grotesque:opsz,wght@12..96,400..600&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
/* Welcome C: a ten-second title card. The film carries the opening; the Starwatch mark locks in as the star forms in the film. */
:root{
  --display:'Bricolage Grotesque','Schibsted Grotesk',system-ui,sans-serif;
  --font:'Schibsted Grotesk',system-ui,sans-serif;
  --word:'Sora','Schibsted Grotesk',system-ui,sans-serif;
  --expo:cubic-bezier(.16,1,.3,1);
}
/* one attribute flips the whole treatment: <body data-tone="dark|light"> */
body,body[data-tone=dark]{--ink:#0A0F11;--paper:#F4F7F7;--quiet:#C3CFCE;--mark:#5FBDB4;--fade:8 12 14}
body[data-tone=light]{--ink:#E6E6E4;--paper:#0F172A;--quiet:#334155;--mark:#0E6E6B;--fade:236 235 232}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);overflow:hidden}
body{color:var(--paper);font-family:var(--font);-webkit-font-smoothing:antialiased}
body.idle,body.idle *{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--ink)}

/* film plate: played once, last frame held */
#bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s var(--expo)}
body.playing #bgv{opacity:1}
/* a flat fade on the left third only, so the map (centre/right) still reads */
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgb(var(--fade)/.92) 0,rgb(var(--fade)/.86) 32%,rgb(var(--fade)/0) 60%)}

/* title */
.title{position:absolute;left:136px;bottom:200px;display:flex;flex-direction:column;align-items:flex-start}
.lockup{display:flex;align-items:center;gap:26px}
.lockup svg{width:96px;height:96px;overflow:visible}
.bl{fill:var(--mark);transform-box:view-box;transform-origin:50% 50%;opacity:0}
body.go .bl{animation:blade .9s var(--expo) forwards}
.bl:nth-child(2){--dx:-18px;--dy:0px}
.bl:nth-child(3){--dx:0px;--dy:18px}
.bl:nth-child(4){--dx:18px;--dy:0px}
.bl:nth-child(5){--dx:0px;--dy:-18px}
@keyframes blade{from{opacity:0;transform:rotate(-75deg) translate(var(--dx),var(--dy)) scale(.7)}to{opacity:1;transform:none}}
.word{font-family:var(--word);font-weight:600;font-size:88px;letter-spacing:-.03em;line-height:1;color:var(--paper)}
.line{margin-top:44px;margin-left:4px;font-family:var(--display);font-optical-sizing:auto;font-weight:460;font-size:52px;line-height:1.1;letter-spacing:-.022em;color:var(--paper)}

.credit{position:absolute;left:140px;bottom:70px;line-height:1.3;font-size:16px;letter-spacing:.01em;color:var(--quiet);word-spacing:.12em}
.enter{position:absolute;right:120px;bottom:70px;line-height:1.3;display:flex;align-items:baseline;gap:12px;font-size:16px;color:var(--quiet);text-decoration:none}
.enter span{color:var(--paper)}
.enter:hover span,.enter:focus-visible span{text-decoration:underline;text-underline-offset:5px}
.enter:focus-visible{outline:none}

/* one orchestrated reveal, started by the film's clock */
.rv{opacity:0;transform:translateY(16px)}
body.go .rv{animation:rise 1.2s var(--expo) forwards;animation-delay:var(--d)}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rv,.bl{opacity:1!important;transform:none!important;animation:none!important}#bgv{transition:none}}
body{cursor:pointer}
</style>
</head>
<body data-tone="dark">
<main id="stage" aria-label="Starwatch welcome">
  <video id="bgv" muted playsinline preload="auto" aria-hidden="true"></video>
  <div class="shade"></div>

  <div class="title">
    <h1 class="lockup">
      <svg viewBox="-32 -32 64 64" aria-hidden="true">
        <title>Starwatch mark</title>
        <path class="bl" d="M-30,0L-10.06,8.55L-6.77,-1.31L-5.21,-0.79L-0.91,-5.09L-10.59,-8.32Z"/>
        <path class="bl" d="M0,30L8.55,10.06L-1.31,6.77L-0.79,5.21L-5.09,0.91L-8.32,10.59Z"/>
        <path class="bl" d="M30,0L10.06,-8.55L6.77,1.31L5.21,0.79L0.91,5.09L10.59,8.32Z"/>
        <path class="bl" d="M0,-30L-8.55,-10.06L1.31,-6.77L0.79,-5.21L5.09,-0.91L8.32,-10.59Z"/>
      </svg>
      <span class="word rv" style="--d:.6s">Starwatch</span>
    </h1>
    <p class="line rv" style="--d:.85s">Every rival post,<br>seen the moment it lands.</p>
  </div>

  <p class="credit rv" style="--d:1.15s">Daniel Večeřa &nbsp;·&nbsp; DANDAPANDA &nbsp;·&nbsp; Agents 0.0.7, Prague</p>
  <a class="enter rv" href="atlas.html" style="--d:1.3s">Enter ↵ <span>Open Starwatch</span></a>
</main>
<script>
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${s}) translate(-50%,-50%)`}
addEventListener('resize',fit);fit();

/* The reveal runs on the video's clock. The blades lock in at SYNC_AT (the star forming in the film);
   they start LEAD seconds earlier so the expo ease-out has settled by then. Text follows within ~0.6 s. */
const FILMS={
  paper:{src:'media/welcome-paper.mp4',tone:'light',sync:4.6},
  night:{src:'media/welcome-night.mp4',tone:'dark',sync:3.8},
};
const LEAD=0.6;          // blade animation .9s expo: ~98% settled after .6s
const FALLBACK=6000;     // ms of wall time if a film never plays
const v=document.getElementById('bgv'),B=document.body;
let film=new URLSearchParams(location.search).get('v')==='night'?'night':'paper',gen=0,fired,fb;
function start(){
  const g=++gen,f=FILMS[film];fired=false;clearTimeout(fb);
  B.classList.remove('go','playing');B.dataset.tone=f.tone;
  const fire=()=>{if(fired||g!==gen)return;fired=true;B.classList.add('go')};
  fb=setTimeout(fire,FALLBACK);
  const tick=(now,meta)=>{if(g!==gen)return;const t=meta&&meta.mediaTime!=null?meta.mediaTime:v.currentTime;
    if(t>=f.sync-LEAD||v.ended){fire();return}
    'requestVideoFrameCallback' in v?v.requestVideoFrameCallback(tick):requestAnimationFrame(()=>tick())};
  v.onplaying=()=>{if(g===gen){clearTimeout(fb);B.classList.add('playing')}};
  v.onended=fire;
  v.src=f.src;v.currentTime=0;           // played once; the last frame holds
  v.play().then(()=>tick()).catch(()=>{});
}
/* Chrome defers video in background tabs: start the film and its clock only once the slide is visible */
if(document.hidden){addEventListener('visibilitychange',function h(){if(!document.hidden){removeEventListener('visibilitychange',h);start()}})}else start();

const go=()=>swGo();
addEventListener('click',e=>{e.preventDefault();go()});  /* a click anywhere opens the map */
addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();go()}
  else if(e.key==='v'||e.key==='V'){film=film==='paper'?'night':'paper';start()}
  else if(e.key==='r'||e.key==='R'){start()}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
});
let t;const wake=()=>{document.body.classList.remove('idle');clearTimeout(t);t=setTimeout(()=>document.body.classList.add('idle'),2000)};
addEventListener('mousemove',wake);wake();
</script>
<script src="fx/welcome-go.js"></script>
</body>
</html>
