[project]
name = "starwatch"
version = "0.1.0"
description = "Live public social-media research on a politician, with every fact linked to its source."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[project.scripts]
starwatch = "starwatch.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
