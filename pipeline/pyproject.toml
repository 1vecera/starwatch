[project]
name = "czlake"
version = "0.1.0"
description = "Starwatch evidence pipeline: public-source collection with Apify Actors, account-ownership checks and an immutable DuckDB evidence graph with a read-only local API."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Daniel Večeřa" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=1.11",
    "apify-client>=3.2.1",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyiceberg[pyarrow,sql-sqlite]>=0.12.0",
    "pypdf>=6.0",
    "rapidfuzz>=3.14.6",
    "trafilatura>=2.0",
    "unidecode>=1.4.0",
]

[project.scripts]
czlake = "czlake:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
